  notes: Codex compared the formal statements with the polynomial and probabilistic formulations
    in the manuscript.
alignment:
  namespace: UnfairTrinomial
  statements:
  - source: Theorem 1.1
    lean: UnfairTrinomial.trinomial_factor
    module: Solution
    status: proved
    note: The trinomial is the first factor. Commutativity also permits it to be the second.
  - source: Equivalent probabilistic formulation
    lean: UnfairTrinomial.uniform_of_independent_random_variables
    module: Solution
    status: proved
    note: Support is the set of integer points of positive mass. Either variable can have three
      support points.
acknowledgements: Lean and mathlib provide the proof language, libraries and tactics.
